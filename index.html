<title>Quest for the Exam</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mali:wght@600;700;800&family=Sarabun:wght@400;500;600;700&display=swap');
  :root{
    --paper:#FFF8EC; --paper2:#FFF1D6; --card:#FFFFFF;
    --ink:#3B2F2F; --ink-soft:#8A7A69; --line:#EAD9B8;
    --jungle:#2F8F6E; --sun:#F4A73D; --good:#2F8F6E; --bad:#E0574B;
    --c-eng:#FF6F91; --c-math:#4EA8DE; --c-sci:#7ED957; --c-health:#FF8C42;
    --c-social:#B48CFF; --c-thai:#F4A73D; --c-chinese:#E63946; --c-conv:#29A8AB;
    --shadow: 0 6px 0 rgba(59,47,47,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1E1A15; --paper2:#251F17; --card:#2B2419;
      --ink:#F3E7D4; --ink-soft:#C4B197; --line:#3E3527;
      --jungle:#4FB78F; --sun:#F6B85A; --good:#4FB78F; --bad:#EF7A70;
      --shadow: 0 6px 0 rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1E1A15; --paper2:#251F17; --card:#2B2419;
    --ink:#F3E7D4; --ink-soft:#C4B197; --line:#3E3527;
    --jungle:#4FB78F; --sun:#F6B85A; --good:#4FB78F; --bad:#EF7A70;
    --shadow: 0 6px 0 rgba(0,0,0,0.35);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--jungle) 10%, transparent), transparent 45%),
      radial-gradient(circle at 90% 85%, color-mix(in srgb, var(--sun) 14%, transparent), transparent 50%),
      var(--paper);
    color:var(--ink); font-family:'Sarabun','Noto Sans Thai',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Mali','Sarabun',sans-serif; text-wrap:balance; }
  .wrap{ max-width:960px; margin:0 auto; padding:22px 18px 60px; }
  header.top{ display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:20px; text-align:center; }
  .eyebrow{ font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--jungle); font-weight:700; }
  h1{ font-size:clamp(26px,5vw,40px); margin:2px 0 0; font-weight:800; }
  .tagline{ color:var(--ink-soft); font-size:15px; margin:2px 0 10px; }
  .progress-banner{ display:inline-flex; align-items:center; gap:10px; background:var(--card); border:2px solid var(--line); border-radius:999px; padding:8px 20px 8px 10px; box-shadow:var(--shadow); font-weight:700; font-size:15px; }
  .progress-banner .badge{ width:30px; height:30px; border-radius:50%; background:var(--sun); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .progress-track{ width:120px; height:8px; border-radius:99px; background:var(--paper2); overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--jungle),var(--sun)); border-radius:99px; transition:width .5s ease; }

  .screenBlock{ display:none; }
  .screenBlock.active{ display:block; }

  .islands{ position:relative; z-index:1; display:grid; grid-template-columns:repeat(4,1fr); gap:26px 18px; margin-top:26px; }
  @media (max-width:720px){ .islands{ grid-template-columns:repeat(2,1fr); } }
  .island{ background:var(--card); border:none; cursor:pointer; border-radius:26px; padding:20px 12px 16px; text-align:center; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:8px; transition:transform .15s ease; font-family:inherit; color:var(--ink); }
  .island:nth-child(odd){ transform:rotate(-1.2deg); } .island:nth-child(even){ transform:rotate(1.2deg); }
  .island:hover{ transform:translateY(-5px) rotate(0deg) scale(1.03); }
  .island:active{ transform:translateY(2px) rotate(0deg) scale(0.99); }
  .island:focus-visible{ outline:3px solid var(--jungle); outline-offset:3px; }
  .isle-icon{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:#fff; font-family:'Mali',sans-serif; box-shadow:inset 0 -6px 0 rgba(0,0,0,0.14); }
  .isle-name{ font-weight:700; font-size:16px; }
  .isle-sub{ font-size:12px; color:var(--ink-soft); min-height:28px; line-height:1.3; }
  .isle-stars{ font-size:14px; letter-spacing:2px; }
  .star-on{ color:var(--sun); } .star-off{ color:var(--line); }
  footer.note{ text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:36px; line-height:1.7; }

  .quiz-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .back-btn{ display:inline-flex; align-items:center; gap:6px; background:var(--card); border:2px solid var(--line); border-radius:999px; padding:8px 16px; font-weight:700; font-size:14px; cursor:pointer; color:var(--ink); font-family:inherit; }
  .back-btn:hover{ border-color:var(--jungle); color:var(--jungle); }
  .subject-chip{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; }
  .subject-chip .dot{ width:14px; height:14px; border-radius:50%; }
  .unit-title{ text-align:center; font-family:'Mali',sans-serif; font-weight:800; font-size:20px; margin:10px 0 18px; }

  .units-grid{ display:flex; flex-direction:column; gap:14px; max-width:640px; margin:0 auto; }
  .unit-card{ display:flex; align-items:center; gap:14px; background:var(--card); border:2px solid var(--line); border-radius:20px; padding:14px 18px; cursor:pointer; text-align:left; font-family:inherit; color:var(--ink); box-shadow:var(--shadow); }
  .unit-card:hover{ border-color:var(--jungle); }
  .unit-tag{ width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; flex-shrink:0; }
  .unit-info{ flex:1; } .unit-info .n{ font-weight:700; font-size:15.5px; } .unit-info .s{ font-size:12.5px; color:var(--ink-soft); }
  .unit-stars{ font-size:15px; letter-spacing:1px; flex-shrink:0; }

  .dots{ display:flex; gap:6px; justify-content:center; margin:6px 0 20px; flex-wrap:wrap; }
  .dot-step{ width:10px; height:10px; border-radius:50%; background:var(--line); }
  .dot-step.done{ background:var(--jungle); } .dot-step.now{ background:var(--sun); transform:scale(1.3); }

  .paper-card{ background:var(--card); border-radius:22px; padding:30px 26px 26px; box-shadow:var(--shadow); position:relative; max-width:640px; margin:0 auto; }
  .paper-card::before{ content:""; position:absolute; top:14px; left:24px; right:24px; height:0; border-top:2px dashed var(--line); }
  .q-index{ font-family:'Mali',sans-serif; font-weight:800; color:var(--ink-soft); font-size:13px; margin-top:10px; letter-spacing:.06em; text-transform:uppercase; }
  .q-text{ font-size:clamp(19px,3vw,23px); font-weight:700; margin:8px 0 18px; line-height:1.5; }

  .listen-row{ display:flex; align-items:center; gap:14px; background:var(--paper2); border-radius:16px; padding:16px; margin-bottom:18px; }
  .hanzi{ font-family:'Mali',sans-serif; font-size:40px; font-weight:800; }
  .pinyin{ font-size:13px; color:var(--ink-soft); }
  .listen-btn{ font-family:inherit; font-weight:800; font-size:14px; color:#fff; background:linear-gradient(135deg,var(--c-chinese),var(--sun)); border:none; border-radius:12px; padding:10px 16px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.15); }
  .listen-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }

  .choices{ display:flex; flex-direction:column; gap:12px; }
  .choice-btn{ font-family:inherit; text-align:left; font-size:17px; font-weight:600; color:var(--ink); background:var(--paper2); border:2px solid var(--line); border-radius:16px; padding:14px 18px; cursor:pointer; transition:transform .1s ease, border-color .15s ease; }
  .choice-btn:hover:not(:disabled){ border-color:var(--jungle); transform:translateY(-2px); }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{ background:color-mix(in srgb, var(--good) 18%, var(--card)); border-color:var(--good); color:var(--good); }
  .choice-btn.wrong{ background:color-mix(in srgb, var(--bad) 16%, var(--card)); border-color:var(--bad); color:var(--bad); }

  .feedback{ margin-top:18px; min-height:52px; }
  .feedback-line{ font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; }
  .feedback-note{ color:var(--ink-soft); font-size:14px; margin-top:4px; }
  .feedback-line.ok{ color:var(--good); } .feedback-line.no{ color:var(--bad); }

  .next-btn{ margin-top:16px; font-family:inherit; font-weight:800; font-size:16px; color:#fff; background:linear-gradient(135deg,var(--jungle),color-mix(in srgb, var(--jungle) 60%, var(--sun))); border:none; border-radius:14px; padding:12px 26px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.15); display:none; }
  .next-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }

  /* match game */
  .match-wrap{ display:flex; gap:22px; justify-content:center; max-width:640px; margin:0 auto; flex-wrap:wrap; }
  .match-col{ display:flex; flex-direction:column; gap:10px; width:220px; }
  .match-chip{ font-family:inherit; font-weight:700; font-size:15px; border-radius:14px; padding:12px 14px; cursor:pointer; border:3px solid var(--line); background:var(--card); color:var(--ink); text-align:center; transition:transform .1s; }
  .match-chip .sw{ display:inline-block; width:22px; height:22px; border-radius:6px; vertical-align:middle; margin-right:8px; border:2px solid rgba(0,0,0,0.1); }
  .match-chip.sel{ border-color:var(--sun); transform:scale(1.04); }
  .match-chip.matched{ border-color:var(--good); background:color-mix(in srgb, var(--good) 16%, var(--card)); opacity:.75; cursor:default; }
  .match-chip.err{ border-color:var(--bad); }
  .match-chip.swatch-only{ padding:0; height:48px; overflow:hidden; }
  .match-chip.swatch-only .block{ display:block; width:100%; height:100%; }
  .match-status{ text-align:center; margin-top:16px; font-weight:700; color:var(--ink-soft); max-width:640px; margin-left:auto; margin-right:auto; }

  #result{ text-align:center; }
  .stars-big{ font-size:56px; letter-spacing:8px; margin:10px 0; }
  .result-score{ font-family:'Mali',sans-serif; font-size:22px; font-weight:800; margin-bottom:6px; }
  .result-msg{ color:var(--ink-soft); font-size:16px; margin-bottom:26px; }
  .result-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .action-btn{ font-family:inherit; font-weight:800; font-size:15px; border:none; border-radius:14px; padding:12px 24px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.15); }
  .action-btn.primary{ color:#fff; background:linear-gradient(135deg,var(--jungle),color-mix(in srgb, var(--jungle) 60%, var(--sun))); }
  .action-btn.ghost{ color:var(--ink); background:var(--paper2); border:2px solid var(--line); box-shadow:none; }
  .action-btn:active{ transform:translateY(3px); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Term 1 Exam Prep · Kindergarten 3</div>
    <h1 class="display">🧭 Quest for the Exam</h1>
    <p class="tagline">Pick a subject → pick a topic → answer all 10 questions and collect stars!</p>
    <div class="progress-banner">
      <span class="badge">⭐</span>
      <span id="totalStarsText">0 / 0 stars</span>
      <span class="progress-track"><span class="progress-fill" id="totalFill" style="width:0%"></span></span>
    </div>
  </header>

  <section id="map" class="screenBlock active">
    <div class="islands" id="islands"></div>
    <footer class="note">Tap an island to see its topics · your best star score is saved on this device 🌟</footer>
  </section>

  <section id="units" class="screenBlock">
    <div class="quiz-top">
      <button class="back-btn" id="backToMapBtn">← Back to Map</button>
      <div class="subject-chip"><span class="dot" id="unitsDot"></span><span id="unitsSubjectName"></span></div>
    </div>
    <div class="unit-title" id="unitsTitle"></div>
    <div class="units-grid" id="unitsGrid"></div>
  </section>

  <section id="quiz" class="screenBlock">
    <div class="quiz-top">
      <button class="back-btn" id="backToUnitsBtn">← Topics</button>
      <div class="subject-chip"><span class="dot" id="chipDot"></span><span id="chipName"></span></div>
    </div>
    <div class="dots" id="dots"></div>

    <div id="mcCard" class="paper-card">
      <div class="q-index" id="qIndex">Question 1 / 10</div>
      <div id="listenBox" style="display:none" class="listen-row">
        <div><div class="hanzi" id="hanziText"></div><div class="pinyin" id="pinyinText"></div></div>
        <button class="listen-btn" id="listenBtn">🔊 Listen</button>
      </div>
      <div class="q-text" id="qText"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">Next →</button>
    </div>

    <div id="matchCard" style="display:none">
      <div class="q-index" style="text-align:center">Match every word to its correct pair</div>
      <div class="match-wrap">
        <div class="match-col" id="matchColLeft"></div>
        <div class="match-col" id="matchColRight"></div>
      </div>
      <div class="match-status" id="matchStatus">Matched 0 / 10</div>
      <div style="text-align:center"><button class="next-btn" id="matchNextBtn" style="display:none">See Results →</button></div>
    </div>
  </section>

  <section id="result" class="screenBlock">
    <div class="stars-big" id="resultStars"></div>
    <div class="result-score display" id="resultScore"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="result-actions">
      <button class="action-btn primary" id="retryBtn">Try Again</button>
      <button class="action-btn ghost" id="toUnitsBtn">Other Topics</button>
      <button class="action-btn ghost" id="toMapBtn">Back to Map</button>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  function Q(q,choices,a,note){ return {q:q,choices:choices,a:a,note:note||''}; }
  function L(hanzi,pinyin,choices,a,note){ return {hanzi:hanzi,pinyin:pinyin,q:'Listen to the pronunciation and choose the correct meaning',choices:choices,a:a,note:note||'',listen:true}; }

  var SUBJECTS = [
  { id:'eng', name:'English & Grammar', color:'var(--c-eng)', icon:'Aa', units:[
    { id:'eng-phonics', name:'Phonics', sub:'Short "u" sound and l-blends', questions:[
      Q('Which word has the short "u" sound, like "cup"?',['sun','cat','dog'],0,'sun has the short u sound'),
      Q('Which word has the short "u" sound?',['pen','bus','hat'],1,'bus has the short u sound'),
      Q('c _ p reads as "cup" — which letter is missing?',['a','u','e'],1,'c-u-p = cup'),
      Q('s _ n reads as "sun" — which letter is missing?',['u','i','o'],0,'s-u-n = sun'),
      Q('Which word has the short "u" sound like "sun"?',['mud','mad','mid'],0,'mud has the short u sound'),
      Q('Which word starts with the "fl" sound (l-blend)?',['flag','bag','tag'],0,'flag starts with f+l'),
      Q('Which word starts with the "cl" sound (l-blend)?',['cap','clap','tap'],1,'clap starts with c+l'),
      Q('Which word starts with the "gl" sound (l-blend)?',['glass','gas','bag'],0,'glass starts with g+l'),
      Q('Which word starts with the "pl" sound (l-blend)?',['plane','pan','van'],0,'plane starts with p+l'),
      Q('Which word starts with the "bl" sound (l-blend)?',['blue','bue','van'],0,'blue starts with b+l')
    ]},
    { id:'eng-grammar', name:'Grammar', sub:'He, She, It and Nouns', questions:[
      Q('"____ is a boy." Which word fits?',['He','She','It'],0,'A boy is male, so use He'),
      Q('"____ is a girl." Which word fits?',['He','She','It'],1,'A girl is female, so use She'),
      Q('"____ is a ball." Which word fits?',['He','She','It'],2,'An object uses It'),
      Q('"____ is a dog." Which word fits?',['He','She','It'],2,'An animal in general uses It'),
      Q('Which word is the noun in "The dog runs."?',['dog','runs','the'],0,'dog is the noun'),
      Q('Which word is the noun in "I like cats."?',['like','cats','I'],1,'cats is the noun'),
      Q('Which word is a Proper Noun?',['dog','Tom','school'],1,'Tom is a proper name'),
      Q('Which word is a Proper Noun?',['Bangkok','city','table'],0,'Bangkok is a proper name'),
      Q('Which word is a Common Noun?',['dog','Anna','Tokyo'],0,'dog is a common noun'),
      Q('Which word is a Common Noun?',['school','Mary','London'],0,'school is a common noun')
    ]},
    { id:'eng-reading', name:'Reading & Writing', sub:'CVC spelling and "Buns in the Pan"', questions:[
      Q('Put the sentence in the correct order',['This is a bun.','Bun a is this.','Is this a bun'],0,'The correct order is: This is a bun.'),
      Q('b _ g reads as "bug" — which letter is missing?',['u','i','e'],0,'b-u-g = bug'),
      Q('m _ g reads as "mug" — which letter is missing?',['u','a','e'],0,'m-u-g = mug'),
      Q('j _ g reads as "jug" — which letter is missing?',['u','a','e'],0,'j-u-g = jug'),
      Q('🍞 matches which word?',['bun','pan','fish'],0,'🍞 = bun'),
      Q('🍳 matches which word?',['bun','pan','fish'],1,'🍳 = pan'),
      Q('In the story "Buns in the Pan," what is in the pan?',['Buns','Fish','Eggs'],0,'Buns are in the Pan'),
      Q('What do we use to bake the buns in this story?',['Pan','Book','Chair'],0,'We use a Pan to bake the buns'),
      Q('Put the sentence in the correct order',['I like a bun.','Bun I a like.','Like bun a I.'],0,'The correct order is: I like a bun.'),
      Q('Which sentence is correct?',['The buns are hot.','Buns hot the are.','Hot are buns the.'],0,'"The buns are hot." has the correct word order')
    ]}
  ]},
  { id:'math', name:'Math', color:'var(--c-math)', icon:'🔢', units:[
    { id:'math-ordinal', name:'Ordinal Numbers & Counting', sub:'Ordinal Numbers & Counting', questions:[
      Q('1st, 2nd, ___ , 4th — what is missing?',['3rd','5th','10th'],0,'Counting on from 2nd is 3rd'),
      Q('Does 5th come before or after 4th?',['Before','After'],1,'5 is greater than 4, so it comes after'),
      Q('🍎🍎🍎🍎 — how many apples?',['3','4','5'],1,'Count them: 4 apples'),
      Q('🐟🐟🐟🐟🐟🐟🐟 — how many fish?',['6','7','8'],1,'Count them: 7 fish'),
      Q('⭐⭐⭐⭐⭐⭐⭐⭐⭐ — how many stars?',['8','9','10'],1,'Count them: 9 stars'),
      Q('The first person to cross the finish line is called what place?',['1st','2nd','3rd'],0,'The first person is 1st place'),
      Q('3rd place is between which two places?',['2nd and 4th','1st and 2nd','4th and 5th'],0,'3rd sits between 2nd and 4th'),
      Q('🍌🍌🍌🍌🍌🍌🍌🍌🍌🍌 — how many bananas?',['9','10','11'],1,'Count them: 10 bananas'),
      Q('2nd, 3rd, ___ — what is missing?',['4th','1st','5th'],0,'Counting on from 3rd is 4th'),
      Q('🚗🚗🚗🚗🚗🚗 — how many cars?',['5','6','7'],1,'Count them: 6 cars')
    ]},
    { id:'math-addsub', name:'Addition & Subtraction', sub:'Addition & Subtraction within 20', questions:[
      Q('5 + 3 = ?',['7','8','9'],1,'5+3=8'),
      Q('8 + 7 = ?',['14','15','16'],1,'8+7=15'),
      Q('9 + 6 = ?',['14','15','16'],1,'9+6=15'),
      Q('10 + 8 = ?',['17','18','19'],1,'10+8=18'),
      Q('15 − 4 = ?',['10','11','12'],1,'15-4=11'),
      Q('20 − 9 = ?',['10','11','12'],1,'20-9=11'),
      Q('18 − 10 = ?',['7','8','9'],1,'18-10=8'),
      Q('12 − 5 = ?',['6','7','8'],1,'12-5=7'),
      Q('6 + 9 = ?',['14','15','16'],1,'6+9=15'),
      Q('17 − 8 = ?',['8','9','10'],1,'17-8=9')
    ]},
    { id:'math-compare', name:'Comparing & Numbers', sub:'Less/More than & Writing 11-20', questions:[
      Q('12 ___ 8 — which sign is correct?',['>','<','='],0,'12 is greater than 8'),
      Q('6 ___ 14 — which sign is correct?',['>','<','='],1,'6 is less than 14'),
      Q('9 ___ 9 — which sign is correct?',['>','<','='],2,'9 equals 9'),
      Q('15 ___ 20 — which sign is correct?',['>','<','='],1,'15 is less than 20'),
      Q('11, 12, ___, 14, 15 — what number is missing?',['13','16','10'],0,'Counting on from 12 is 13'),
      Q('16, 17, ___, 19, 20 — what number is missing?',['18','15','21'],0,'Counting on from 17 is 18'),
      Q('Which number is the biggest?',['14','9','20'],2,'20 is the biggest number'),
      Q('Which number is the smallest?',['18','3','11'],1,'3 is the smallest number'),
      Q('Which numeral matches "eleven"?',['11','10','12'],0,'Eleven = 11'),
      Q('Which numeral matches "twenty"?',['19','20','21'],1,'Twenty = 20')
    ]}
  ]},
  { id:'sci', name:'Science', color:'var(--c-sci)', icon:'🔬', units:[
    { id:'sci-colors', name:'Colors (Matching)', sub:'Match each color word to its swatch', type:'match', pairs:[
      {en:'Red',hex:'#E53935'},{en:'Blue',hex:'#1E88E5'},
      {en:'Yellow',hex:'#FDD835'},{en:'Green',hex:'#43A047'},
      {en:'Pink',hex:'#EC407A'},{en:'Orange',hex:'#FB8C00'},
      {en:'Purple',hex:'#8E24AA'},{en:'Brown',hex:'#6D4C41'},
      {en:'Black',hex:'#212121'},{en:'White',hex:'#FAFAFA'}
    ]},
    { id:'sci-food', name:'Food & Meals', sub:'Healthy Food & Meals', questions:[
      Q('Which food is good for your body?',['🥦 Broccoli','🍬 Candy'],0,'Vegetables are good for your body.'),

  var STORAGE_KEY = 'examquest_stars_v2_en';
  var memStore = {};
  function loadStars(){ try{ var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return memStore; } }
  function saveStars(map){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(map)); }catch(e){ memStore = map; } }
  var starsMap = loadStars();

  function allUnits(){ var out=[]; SUBJECTS.forEach(function(s){ s.units.forEach(function(u){ out.push(u.id); }); }); return out; }
  var TOTAL_UNITS = allUnits().length;

  var state = { subject:null, unit:null, idx:0, score:0, locked:false, matched:0, wrong:0 };

  var screens = { map:document.getElementById('map'), units:document.getElementById('units'), quiz:document.getElementById('quiz'), result:document.getElementById('result') };
  function show(name){ Object.keys(screens).forEach(function(k){ screens[k].classList.toggle('active', k===name); }); }

  function starsFor(score){ if(score>=9) return 3; if(score>=7) return 2; if(score>=5) return 1; return 0; }
  function starString(n,total){ total=total||3; var s=''; for(var i=0;i<total;i++){ s += (i<n)?'<span class="star-on">★</span>':'<span class="star-off">☆</span>'; } return s; }

  function subjectStars(subj){ var t=0; subj.units.forEach(function(u){ t += starsMap[u.id]||0; }); return t; }

  function renderMap(){
    var islandsEl = document.getElementById('islands');
    islandsEl.innerHTML = '';
    var total = 0;
    SUBJECTS.forEach(function(subj){
      var best = subjectStars(subj);
      total += best;
      var btn = document.createElement('button');
      btn.className = 'island';
      btn.innerHTML =
        '<span class="isle-icon" style="background:'+subj.color+'">'+subj.icon+'</span>'+
        '<span class="isle-name">'+subj.name+'</span>'+
        '<span class="isle-sub">'+subj.units.length+' topics</span>'+
        '<span class="isle-stars">'+starString(best, subj.units.length*3)+'</span>';
      btn.addEventListener('click', function(){ openSubject(subj.id); });
      islandsEl.appendChild(btn);
    });
    var maxStars = TOTAL_UNITS*3;
    document.getElementById('totalStarsText').textContent = total+' / '+maxStars+' stars';
    document.getElementById('totalFill').style.width = Math.round(100*total/maxStars)+'%';
    show('map');
  }

  function openSubject(id){
    var subj = SUBJECTS.filter(function(s){return s.id===id;})[0];
    state.subject = subj;
    document.getElementById('unitsDot').style.background = subj.color;
    document.getElementById('unitsSubjectName').textContent = subj.name;
    document.getElementById('unitsTitle').textContent = subj.name+' — choose a topic';
    var grid = document.getElementById('unitsGrid');
    grid.innerHTML = '';
    subj.units.forEach(function(u){
      var best = starsMap[u.id]||0;
      var card = document.createElement('button');
      card.className = 'unit-card';
      card.innerHTML =
        '<span class="unit-tag" style="background:'+subj.color+'">'+(u.type==='match'?'🎨':'📝')+'</span>'+
        '<span class="unit-info"><span class="n">'+u.name+'</span><br><span class="s">'+u.sub+'</span></span>'+
        '<span class="unit-stars">'+starString(best)+'</span>';
      card.addEventListener('click', function(){ openUnit(subj, u); });
      grid.appendChild(card);
    });
    show('units');
  }

  function openUnit(subj, unit){
    state.subject = subj; state.unit = unit; state.idx = 0; state.score = 0; state.locked = false; state.matched = 0; state.wrong = 0;
    document.getElementById('chipDot').style.background = subj.color;
    document.getElementById('chipName').textContent = unit.name;
    show('quiz');
    if(unit.type === 'match'){
      document.getElementById('mcCard').style.display='none';
      document.getElementById('matchCard').style.display='block';
      document.getElementById('dots').innerHTML='';
      renderMatch(unit);
    } else {
      document.getElementById('mcCard').style.display='block';
      document.getElementById('matchCard').style.display='none';
      renderDots();
      renderQuestion();
    }
  }

  function renderDots(){
    var dots = document.getElementById('dots');
    dots.innerHTML = '';
    state.unit.questions.forEach(function(_,i){
      var d = document.createElement('span');
      d.className = 'dot-step'+(i<state.idx?' done':'')+(i===state.idx?' now':'');
      dots.appendChild(d);
    });
  }

  function speak(text, lang){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang || 'zh-CN'; u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function renderQuestion(){
    state.locked = false;
    var total = state.unit.questions.length;
    var item = state.unit.questions[state.idx];
    document.getElementById('qIndex').textContent = 'Question '+(state.idx+1)+' / '+total;
    document.getElementById('qText').textContent = item.q;
    var listenBox = document.getElementById('listenBox');
    if(item.listen){
      listenBox.style.display = 'flex';
      document.getElementById('hanziText').textContent = item.hanzi;
      document.getElementById('pinyinText').textContent = item.pinyin;
      document.getElementById('listenBtn').onclick = function(){ speak(item.hanzi); };
    } else {
      listenBox.style.display = 'none';
    }
    var choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';
    item.choices.forEach(function(choice,i){
      var b = document.createElement('button');
      b.className = 'choice-btn';
      b.textContent = choice;
      b.addEventListener('click', function(){ selectAnswer(i); });
      choicesEl.appendChild(b);
    });
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('nextBtn').style.display = 'none';
    renderDots();
  }

  function selectAnswer(i){
    if(state.locked) return;
    state.locked = true;
    var item = state.unit.questions[state.idx];
    var buttons = document.querySelectorAll('#choices .choice-btn');
    buttons.forEach(function(b){ b.disabled = true; });
    var correct = (i === item.a);
    if(correct){ state.score++; buttons[i].classList.add('correct'); }
    else{ buttons[i].classList.add('wrong'); buttons[item.a].classList.add('correct'); }
    var fb = document.getElementById('feedback');
    fb.innerHTML = '<div class="feedback-line '+(correct?'ok':'no')+'">'+(correct?'✅ Correct!':'❌ Not quite')+'</div>'+
                    '<div class="feedback-note">'+item.note+'</div>';
    document.getElementById('nextBtn').style.display = 'inline-block';
  }

  document.getElementById('nextBtn').addEventListener('click', function(){
    state.idx++;
    if(state.idx >= state.unit.questions.length){ finishUnit(state.score, state.unit.questions.length); }
    else{ renderQuestion(); }
  });

  function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  var MATCH_LANG = 'en-US';
  var MATCH_RIGHT_MSG = 'Great job!';
  var MATCH_WRONG_MSG = 'Try again!';

  function renderMatch(unit){
    var left = shuffle(unit.pairs.map(function(p,i){ return {key:i, label:p.en}; }));
    var right = shuffle(unit.pairs.map(function(p,i){ return {key:i, hex:p.hex}; }));
    var leftSel = null, rightSel = null;
    var matched = {};
    var errKeys = null; // {left:key, right:key} while flashing a wrong pair
    var busy = false;
    var wrong = 0;
    var colL = document.getElementById('matchColLeft');
    var colR = document.getElementById('matchColRight');
    colL.innerHTML = ''; colR.innerHTML = '';
    document.getElementById('matchNextBtn').style.display = 'none';

    function renderCols(){
      colL.innerHTML = '';
      left.forEach(function(item){
        var isErr = errKeys && errKeys.left === item.key;
        var b = document.createElement('button');
        b.className = 'match-chip'+(matched[item.key]?' matched':'')+(leftSel===item?' sel':'')+(isErr?' err':'');
        b.textContent = item.label;
        if(!matched[item.key] && !busy) b.addEventListener('click', function(){ leftSel = item; rightSel=null; renderCols(); });
        colL.appendChild(b);
      });
      colR.innerHTML = '';
      right.forEach(function(item){
        var isErr = errKeys && errKeys.right === item.key;
        var b = document.createElement('button');
        b.className = 'match-chip swatch-only'+(matched[item.key]?' matched':'')+(rightSel===item?' sel':'')+(isErr?' err':'');
        b.setAttribute('aria-label','color swatch');
        b.innerHTML = '<span class="block" style="background:'+item.hex+'"></span>';
        if(!matched[item.key] && !busy) b.addEventListener('click', function(){
          if(!leftSel) return;
          if(leftSel.key === item.key){
            matched[item.key] = true;
            state.matched = Object.keys(matched).length;
            leftSel = null; rightSel = null;
            renderCols();
            speak(MATCH_RIGHT_MSG, MATCH_LANG);
            document.getElementById('matchStatus').textContent = 'Matched '+state.matched+' / '+unit.pairs.length;
            if(state.matched >= unit.pairs.length){
              document.getElementById('matchStatus').textContent = 'All matched! 🎉 Mistakes: '+wrong;
              document.getElementById('matchNextBtn').style.display = 'inline-block';
            }
          } else {
            wrong++; state.wrong = wrong; busy = true;
            errKeys = { left:leftSel.key, right:item.key };
            renderCols();
            speak(MATCH_WRONG_MSG, MATCH_LANG);
            setTimeout(function(){ leftSel=null; rightSel=null; errKeys=null; busy=false; renderCols(); }, 700);
          }
        });
        colR.appendChild(b);
      });
    }
    renderCols();
    document.getElementById('matchStatus').textContent = 'Matched 0 / '+unit.pairs.length;
    document.getElementById('matchNextBtn').onclick = function(){
      var score10 = Math.max(0, 10 - wrong);
      finishUnit(Math.min(10,score10), 10);
    };
  }

  function finishUnit(score, total){
    var stars = starsFor(score);
    var prevBest = starsMap[state.unit.id] || 0;
    if(stars > prevBest){ starsMap[state.unit.id] = stars; saveStars(starsMap); }
    document.getElementById('resultStars').innerHTML = starString(stars);
    document.getElementById('resultScore').textContent = 'Score '+score+' / '+total;
    var msg;
    if(stars===3) msg='Amazing! Great job! 🎉';
    else if(stars===2) msg='Excellent! Almost a full star score!';
    else if(stars===1) msg='Good job! Try again to earn more stars.';
    else msg='No worries, let\'s try again!';
    document.getElementById('resultMsg').textContent = msg;
    show('result');
  }

  document.getElementById('backToMapBtn').addEventListener('click', renderMap);
  document.getElementById('backToUnitsBtn').addEventListener('click', function(){ openSubject(state.subject.id); });
  document.getElementById('toMapBtn').addEventListener('click', renderMap);
  document.getElementById('toUnitsBtn').addEventListener('click', function(){ openSubject(state.subject.id); });
  document.getElementById('retryBtn').addEventListener('click', function(){ openUnit(state.subject, state.unit); });

  renderMap();
})();
</script>
